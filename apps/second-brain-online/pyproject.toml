[project]
name = "second-brain-online"
version = "0.1.0"
description = "Production grade RAG syayem implementing RAG over notion data."
readme = "README.md"
requires-python = ">=3.11"
authors = []
license = { text = "MIT" }

dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.7.0",
    "pymongo>=4.10.1",
    "langchain>=0.3.14",
    "langchain-mongodb>=0.4.0",
    "langchain-openai>=0.3.1",
    "langchain-core>=0.3.30",
    "smolagents>=1.4.1",
    "opik>=0.1.0",
    "comet_ml>=3.47.6",
    "langchain-huggingface>=0.1.2",
    "fastapi==0.115.2",
    "uvicorn==0.27.1",
    "flashrank",
    "langchain-community==0.4.1",
    "langchain-classic==1.0.2",
    "redis==7.3.0",
    "slowapi>=0.1.9",
    "tenacity>=9.1.4",
    "onnxruntime>=1.17.0",
    "optimum>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.7.2",
]

[tool.pip]
extra-index-url = "https://download.pytorch.org/whl/cpu/torch_stable.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain_online"]

[tool.ruff]
target-version = "py311"

