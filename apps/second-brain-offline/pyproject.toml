[project]
name = "second-brain-offline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "boto3>=1.40.35",
    "crawl4ai>=0.7.4",
    "datasets>=4.2.0",
    "huggingface-hub>=0.35.0",
    "langchain-huggingface>=0.3.1",
    "langchain-mongodb>=0.7.0",
    "langchain-openai>=0.3.35",
    "litellm>=1.77.3",
    "loguru>=0.7.3",
    "matplotlib>=3.10.7",
    "pydantic>=2.11.1",
    "pymongo[srv]>=4.15.1",
    "sentence-transformers>=3.0.1",
    "zenml[server]>=0.85.0",
]

# THIS is the right section for your package layout
[tool.setuptools]
package-dir = {"" = "src"}
packages = ["second_brain_offline"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
